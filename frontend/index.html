<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Captain Medicare</title>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0b4f4a, #0f766e 55%, #0891b2);
        animation: splashFadeOut 0.6s ease 2.4s forwards;
      }
      #splash svg {
        width: 90px; height: 90px;
        opacity: 0; transform: scale(0.6);
        animation: logoPop 0.6s ease 0.2s forwards;
      }
      #splash .pulse {
        stroke-dasharray: 120; stroke-dashoffset: 120;
        animation: drawPulse 1s ease 0.8s forwards;
      }
      #splash h1 {
        margin-top: 18px;
        font-family: "Segoe UI", Arial, sans-serif;
        color: white; font-size: 1.6rem; letter-spacing: 0.3em;
        opacity: 0; animation: textFadeIn 0.8s ease 1.1s forwards;
      }
      #splash p {
        color: rgba(255,255,255,0.85);
        font-family: "Segoe UI", Arial, sans-serif;
        font-size: 0.85rem; letter-spacing: 0.15em;
        opacity: 0; animation: textFadeIn 0.8s ease 1.4s forwards;
      }
      @keyframes logoPop { to { opacity: 1; transform: scale(1); } }
      @keyframes drawPulse { to { stroke-dashoffset: 0; } }
      @keyframes textFadeIn { to { opacity: 1; } }
      @keyframes splashFadeOut { to { opacity: 0; visibility: hidden; pointer-events: none; } }
    </style>
  </head>
  <body>
    <div id="splash">
      <svg viewBox="0 0 100 100" fill="none">
        <circle cx="50" cy="50" r="46" stroke="white" stroke-opacity="0.9" stroke-width="3"/>
        <path class="pulse" d="M15 50h14l6-16 12 32 8-22 5 14h25" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1>CAPTAIN MEDICARE</h1>
      <p>HOSPITAL MANAGEMENT SYSTEM</p>
    </div>
    <script>
      // Show the intro only once per browser session
      (function () {
        var splash = document.getElementById("splash");
        if (sessionStorage.getItem("splashShown")) {
          splash.style.display = "none";
        } else {
          setTimeout(function () { sessionStorage.setItem("splashShown", "1"); }, 3000);
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
